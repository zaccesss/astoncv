# dependency update PRs on the 1st and 15th of each month at 18:00 UK time for this repo's two ecosystems: Composer for the PHP
# application and GitHub Actions for the workflow action versions. Major version bumps
# are ignored across both, since a breaking change should never land automatically,
# matching the pattern used across the rest of the fleet.

version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
